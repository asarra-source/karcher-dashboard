function setTab(tab){['emp','part','total'].forEach(t=>{const show=t===tab;['kpis','charts','list'].forEach(s=>document.getElementById(s+'-'+t).style.display=show?(s==='list'?'block':'grid'):'none');document.getElementById('tab-'+t).classList.toggle('off',t!==tab);});}
function buildKPIs(seg){const d=DATA[seg];const ta=d.reduce((s,m)=>s+m.altas,0);const tb=d.reduce((s,m)=>s+m.bajas,0);const ad=d.filter(m=>m.ticket_medio>0);const tp=Math.round(ad.reduce((s,m)=>s+m.ticket_medio,0)/ad.length);const mx=Math.max(...d.map(m=>m.activos));const mm=d.find(m=>m.activos===mx).m;const la=d[d.length-1].activos;const items=[{l:'Total altas',v:ta,s:'Mar 2025 → Jul 2026'},{l:'Total bajas (churn)',v:tb,s:'Mar 2025 → Jul 2026'},{l:'Ticket medio global',v:'€'+tp,s:'promedio del período'},{l:'Pico activos',v:mx,s:'cierre '+mm},{l:'Activos Jul 2026',v:la,s:'último mes del período'}];document.getElementById('kpis-'+seg).innerHTML=items.map(i=>`<div class="kpi"><div class="kl">${i.l}</div><div class="kv">${i.v}</div><div class="ks">${i.s}</div></div>`).join('');}
function buildCharts(seg){const d=DATA[seg];const col=COLOR[seg];const gc='rgba(0,0,0,0.06)',tc='#888';const labels=d.map(m=>m.m);const cont=document.getElementById('charts-'+seg);cont.innerHTML=`<div class="cw"><div class="st">Altas y bajas por mes</div><div style="position:relative;height:180px"><canvas id="bar-${seg}"></canvas></div></div><div class="cw"><div class="st">Activos al cierre del mes</div><div style="position:relative;height:180px"><canvas id="line-${seg}"></canvas></div></div><div class="cw"><div class="st">Ticket medio (€)</div><div style="position:relative;height:180px"><canvas id="ticket-${seg}"></canvas></div></div>`;['bar','line','ticket'].forEach(k=>{if(charts[k+'-'+seg])charts[k+'-'+seg].destroy();});charts['bar-'+seg]=new Chart(document.getElementById('bar-'+seg),{type:'bar',data:{labels,datasets:[{label:'Altas',data:d.map(m=>m.altas),backgroundColor:'rgba(99,153,34,0.8)',borderRadius:3},{label:'Bajas',data:d.map(m=>-m.bajas),backgroundColor:'rgba(226,75,74,0.8)',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:tc,font:{size:10},boxWidth:8}}},scales:{x:{stacked:true,ticks:{color:tc,font:{size:9}},grid:{color:gc}},y:{stacked:true,ticks:{color:tc,font:{size:10},callback:v=>Math.abs(v)},grid:{color:gc}}}}});charts['line-'+seg]=new Chart(document.getElementById('line-'+seg),{type:'line',data:{labels,datasets:[{data:d.map(m=>m.activos),borderColor:col,backgroundColor:col+'22',fill:true,tension:0.4,pointRadius:4,pointBackgroundColor:col}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:9}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10}},grid:{color:gc},min:0}}}});charts['ticket-'+seg]=new Chart(document.getElementById('ticket-'+seg),{type:'bar',data:{labels,datasets:[{data:d.map(m=>m.ticket_medio),backgroundColor:col+'bb',borderRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>'€'+ctx.parsed.y}}},scales:{x:{ticks:{color:tc,font:{size:9}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10},callback:v=>'€'+v},grid:{color:gc},min:0,suggestedMax:1400}}}});}
function nameTag(name,seg){if(seg!=='total')return name;const isB2B=empNames.has(name);return name+(isB2B?'<span class="seg-label seg-b2b">B2B</span>':'<span class="seg-label seg-b2c">B2C</span>');}
function buildList(seg){const d=DATA[seg];document.getElementById('list-'+seg).innerHTML=d.slice().reverse().map((m,i)=>{const id=seg+'-'+i;const ah=m.al.length?m.al.map(n=>`<div class="ci"><span class="dot da"></span>${nameTag(n,seg)}</div>`).join(''):'<div class="none">Sin altas</div>';const bh=m.bl.length?m.bl.map(n=>`<div class="ci"><span class="dot db"></span>${nameTag(n,seg)}</div>`).join(''):'<div class="none">Sin bajas (churn)</div>';const noMov=m.altas===0&&m.bajas===0?`<span class="bw">Sin movimientos</span>`:'';return `<div class="tb"><div class="th" onclick="tog('${id}')"><div><div class="tq">${m.m}</div><div class="tv">Venta del mes: €${m.venta.toLocaleString('es-ES')}</div></div><div class="bgs">${m.altas>0?`<span class="ba">+${m.altas} altas</span>`:''}${m.bajas>0?`<span class="bb">−${m.bajas} bajas</span>`:''}${noMov}<span class="bt">Ø €${m.ticket_medio}</span><span class="bn">${m.activos} activos</span><span class="arr" id="ar-${id}">▾</span></div></div><div id="dt-${id}" class="det" style="display:none"><div class="ll"><div><div class="lt a">Altas del mes</div>${ah}</div><div><div class="lt b">Bajas (churn)</div>${bh}</div></div><div class="sec"><div class="ml">Ticket medio</div><div class="tr2"><span class="trl">Media</span><span class="trv">€${m.ticket_medio}</span></div><div class="tr2"><span class="trl">Mínimo</span><span class="trv">€${m.ticket_min}</span></div><div class="tr2"><span class="trl">Máximo</span><span class="trv">€${m.ticket_max}</span></div><div class="tr2"><span class="trl">Nº de pagos</span><span class="trv">${m.n_pagos}</span></div></div></div></div>`;}).join('');}
function tog(id){const d=document.getElementById('dt-'+id),a=document.getElementById('ar-'+id);const open=d.style.display==='none';d.style.display=open?'block':'none';a.innerHTML=open?'▴':'▾';}
['emp','part','total'].forEach(seg=>{buildKPIs(seg);buildCharts(seg);buildList(seg);});
</script>
</body>
</html>
